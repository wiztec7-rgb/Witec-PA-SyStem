
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WIZTEC AI Assistant</title>

<style>
:root {
  --navy: #061525;
  --navy2: #102b45;
  --cyan: #38bdf8;
  --green: #25d366;
  --white: #fff;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, sans-serif;
}

body {
  margin: 0;
  background: transparent;
  color: white;
}

#launcher {
  position: absolute;
  right: 5px;
  bottom: 5px;
  width: 66px;
  height: 66px;
  border: 2px solid rgba(255,255,255,.4);
  border-radius: 50%;
  background: linear-gradient(135deg,#0878b8,#064477);
  color: white;
  font-size: 27px;
  cursor: pointer;
  box-shadow: 0 8px 30px rgba(0,0,0,.35);
}

#chat {
  display: none;
  position: absolute;
  inset: 0;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 19px;
  background: var(--navy);
  box-shadow: 0 12px 40px rgba(0,0,0,.4);
}

header {
  min-height: 67px;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: linear-gradient(120deg,#0b3557,#075b86);
}

.avatar {
  width: 39px;
  height: 39px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #38bdf8;
  font-size: 21px;
}

.header-info {
  flex: 1;
}

.header-info strong {
  display: block;
  font-size: 14px;
}

.header-info small {
  color: #a7f3d0;
  font-size: 11px;
}

#close {
  background: transparent;
  color: white;
  border: 0;
  font-size: 25px;
  cursor: pointer;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message {
  max-width: 88%;
  padding: 11px 13px;
  border-radius: 14px;
  font-size: 13px;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.bot {
  align-self: flex-start;
  background: var(--navy2);
  border-bottom-left-radius: 4px;
}

.user {
  align-self: flex-end;
  background: #075985;
  border-bottom-right-radius: 4px;
}

#suggestions {
  padding: 0 12px 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.suggestion {
  border: 1px solid #35617e;
  color: #d9efff;
  background: #102b45;
  padding: 7px 9px;
  border-radius: 20px;
  font-size: 11px;
  cursor: pointer;
}

#input-area {
  display: flex;
  gap: 7px;
  padding: 11px;
  border-top: 1px solid rgba(255,255,255,.12);
  background: #0b2138;
}

#messageInput {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid #45627a;
  border-radius: 22px;
  outline: none;
  color: #172033;
  background: white;
  font-size: 13px;
}

#send {
  width: 43px;
  border: 0;
  border-radius: 50%;
  background: var(--cyan);
  color: #06243a;
  font-size: 18px;
  cursor: pointer;
}

#send:disabled {
  opacity: .5;
  cursor: wait;
}

.footer {
  padding: 5px;
  text-align: center;
  font-size: 9px;
  color: #94a3b8;
  background: #0b2138;
}

@media(max-width:420px) {
  .message { font-size: 12px; }
}
</style>
</head>

<body>

<button id="launcher" aria-label="Open WIZTEC AI">💬</button>

<section id="chat">

  <header>
    <div class="avatar">🎧</div>

    <div class="header-info">
      <strong>WIZTEC AI ASSISTANT</strong>
      <small>● Virtual customer assistance</small>
    </div>

    <button id="close" aria-label="Close chat">×</button>
  </header>

  <div id="messages" aria-live="polite">
    <div class="message bot">
      Hello! Welcome to WIZTEC PA System.

      I'm your virtual assistant. How can I help you with your event or sound system booking?
    </div>
  </div>

  <div id="suggestions">
    <button class="suggestion">Our packages</button>
    <button class="suggestion">How to book</button>
    <button class="suggestion">Payment information</button>
  </div>

  <div id="input-area">
    <input
      id="messageInput"
      type="text"
      maxlength="1500"
      placeholder="Type your message..."
      autocomplete="off"
    >

    <button id="send" aria-label="Send message">➤</button>
  </div>

  <div class="footer">
    Powered by WIZTEC AI
  </div>

</section>

<script>
"use strict";

/* EXISTING WIZTEC APPS SCRIPT ENDPOINT */

const API_BASE =
"https://script.google.com/macros/s/AKfycbzO5EWB-ZKU7cXj8Pb8Dy46OvVjde7OhqxOVdYI8Ude5FyN8Sb9woLsj0l0ylQ5ru3RvQ/exec";

const launcher = document.getElementById("launcher");
const chat = document.getElementById("chat");
const closeButton = document.getElementById("close");
const messages = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("send");

let history = [];
let isSending = false;

function resizeParent(open) {
  window.parent.postMessage({
    type: "WIZTEC_AI_RESIZE",
    open: open
  }, window.location.origin);
}

function openChat() {
  launcher.style.display = "none";
  chat.style.display = "flex";
  resizeParent(true);
}

function closeChat() {
  chat.style.display = "none";
  launcher.style.display = "block";
  resizeParent(false);
}

launcher.addEventListener("click", openChat);
closeButton.addEventListener("click", closeChat);

function addMessage(text, sender) {
  const div = document.createElement("div");

  div.className = "message " + sender;

  // textContent prevents HTML injection.
  div.textContent = text;

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

async function sendMessage(text) {

  if (isSending) return;

  text = String(text || "").trim();

  if (!text) return;

  if (text.length > 1500) {
    addMessage("Please keep your message below 1500 characters.", "bot");
    return;
  }

  isSending = true;
  sendButton.disabled = true;

  addMessage(text, "user");

  const typing = document.createElement("div");
  typing.className = "message bot";
  typing.textContent = "WIZTEC AI is thinking...";
  messages.appendChild(typing);

  try {

    const response = await fetch(API_BASE, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "aiChat",
        message: text,
        history: history
      })
    });

    if (!response.ok) {
      throw new Error("AI service returned an HTTP error.");
    }

    const result = await response.json();

    if (!result.success || !result.reply) {
      throw new Error(
        result.error || "AI response was unavailable."
      );
    }

    typing.remove();

    addMessage(result.reply, "bot");

    history.push({
      role: "user",
      text: text
    });

    history.push({
      role: "model",
      text: result.reply
    });

    history = history.slice(-8);

  } catch (error) {

    typing.remove();

    addMessage(
      "Sorry, I'm temporarily unable to respond. Please try again or contact WIZTEC directly.",
      "bot"
    );

    console.error("WIZTEC AI error:", error);

  } finally {

    isSending = false;
    sendButton.disabled = false;
    input.focus();

  }
}

sendButton.addEventListener("click", function() {
  const text = input.value;
  input.value = "";
  sendMessage(text);
});

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendButton.click();
  }
});

document.querySelectorAll(".suggestion").forEach(function(button) {
  button.addEventListener("click", function() {
    sendMessage(button.textContent);
  });
});
</script>

</body>
</html>
